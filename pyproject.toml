[project]
name = "wisp-automate"
version = "0.1.0"
description = "A lightweight, extensible local automation framework: trigger events, run pipelines of actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eliya Monazam", email = "eliya1384@gmail.com" }]
keywords = ["automation", "cli", "watchdog", "pipeline", "productivity"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "watchdog>=4.0",
]

[project.urls]
Homepage = "https://github.com/eliyamonazam/Wisp-automate-"
Issues = "https://github.com/eliyamonazam/Wisp-automate-/issues"

[project.scripts]
wisp = "wisp.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wisp"]
